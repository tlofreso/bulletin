services:
  ocr-server:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persist Hugging Face model cache (~2GB) across restarts
#      - hf-cache:/root/.cache/huggingface
      - /mnt/user/appdata/ocr:/root
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
    restart: unless-stopped

